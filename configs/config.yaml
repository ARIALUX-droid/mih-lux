# Mini中文版 v2.0.3 by YYDS666 (2026-06-16)
# 项目: https://github.com/666OS/YYDS | 频道: https://t.me/Pinched666
# 请在 proxy-providers 中添加您的订阅链接，或在 proxies 中添加自定义节点


# 锚点配置
x-base-provider: &base-provider {type: http, interval: 86400, health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}, filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'}

x-rule-set-domain: &rule-set-domain { type: http, behavior: domain, format: mrs, interval: 86400 }
x-rule-set-ipcidr: &rule-set-ipcidr { type: http, behavior: ipcidr, format: mrs, interval: 86400 }

proxy-providers:
   1Primary: {<<: *base-provider, url: '订阅链接', override: {additional-prefix: '[P] '}, path: ./proxies/1Primary.yaml}
   2Backup:   {<<: *base-provider, url: '订阅链接',  override: {additional-prefix: '[B] '}, path: ./proxies/2Backup.yaml}

# 基础设置
mode: rule
mixed-port: 7890
tproxy-port: 9898
redir-port: 9797
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: silent
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600
authentication: [mihomo:yyds666]
skip-auth-prefixes: [127.0.0.1/8, '::1/128']
experimental: {quic-go-disable-gso: true}

# 数据库国内加速下载设置
geox-url:
  geoip: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"

# 控制面板
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: yyds666
profile: {store-selected: true, store-fake-ip: true}

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:   {ports: [80, 8080-8880], override-destination: true}
    TLS:     {ports: [443, 8443]}
    QUIC:   {ports: [443, 8443]}
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]

# TUN模式
tun:
  enable: true
  stack: gvisor
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  exclude-package:
    - com.android.phone
    - com.android.settings
    - com.qti.qcc
    - com.android.systemui
    - com.google.android.packageinstaller
    - com.miui.packageinstaller
    - com.android.location.fused

    - com.tencent.mm
    - com.tencent.mobileqq
    - com.eg.android.AlipayGphone
    - com.unionpay

    - com.taobao.taobao
    - com.sankuai.meituan
    - com.autonavi.minimap

    - com.ss.android.ugc.aweme
    - com.ss.android.ugc.aweme.mobile
    - com.xingin.xhs
    - com.chaoxing.fanya

# DNS设置
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [119.29.29.29, 180.184.1.1, 223.5.5.5]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  fake-ip-filter: [+.miwifi.com, +.docker.io, +.market.xiaomi.com, +.push.apple.com]

# 代理策略组
proxy-groups:
  - { name: 手动选择, type: select, include-all: true, filter: '美国|USA|美國|us|US|United States' , icon: https://ghfast.top/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Clubhouse.png }
  - { name: 人工智能, type: select, include-all: true, proxies: [手动选择], icon: https://ghfast.top/https://github.com/Koolson/Qure/raw/master/IconSet/Color/AI.png }
  - { name: EMBY,    type: select, include-all: true, proxies: [手动选择], icon: https://ghfast.top/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Emby.png }
  - { name: 国外流量, type: select, include-all: true, proxies: [手动选择], empty-fallback: REJECT, icon: https://ghfast.top/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Global.png }
  - { name: 国内流量, type: select, include-all: true, proxies: [DIRECT], icon: https://ghfast.top/https://github.com/Koolson/Qure/raw/master/IconSet/Color/China.png }
  - { name: 广告拦截, type: select, proxies: [REJECT-DROP, REJECT, DIRECT], icon: https://ghfast.top/https://github.com/Koolson/Qure/raw/master/IconSet/Color/Reject.png }

# 规则路由
rules:
  #自定义
  - RULE-SET,自定义代理,国外流量
  - RULE-SET,自定义直连,国内流量
  # 广告拦截
  - RULE-SET,Advertising,广告拦截
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((GEOIP,CN,no-resolve)))),广告拦截
  # 本地/私有
  - RULE-SET,Private,DIRECT
  - RULE-SET,PrivateIP,DIRECT,no-resolve
  # 人工智能
  - RULE-SET,AI,人工智能
  - RULE-SET,AIIP,人工智能,no-resolve
  # 国际媒体
  - RULE-SET,Emby,EMBY
  - RULE-SET,EmbyIP,EMBY,no-resolve
  # 国外流量
  - RULE-SET,Proxy,国外流量
  - RULE-SET,ProxyIP,国外流量,no-resolve
  # 国内流量
  - RULE-SET,China,国内流量
  - RULE-SET,ChinaIP,国内流量,no-resolve
  # 兜底规则
  - MATCH,国外流量

# 规则集提供者
rule-providers:
  Advertising:    { <<: *rule-set-domain, url: https://anti-ad.net/mihomo.mrs, path: ./ruleset/Advertising.mrs }
  Private:        { <<: *rule-set-domain, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Private.mrs, path: ./ruleset/Private.mrs }
  AI:             { <<: *rule-set-domain, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AI.mrs, path: ./ruleset/AI.mrs }
  Emby:           { <<: *rule-set-domain, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Emby.mrs, path: ./ruleset/Emby.mrs }
  Proxy:          { <<: *rule-set-domain, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Proxy.mrs, path: ./ruleset/Proxy.mrs }
  China:          { <<: *rule-set-domain, url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs, path: ./ruleset/China.mrs }
  PrivateIP:      { <<: *rule-set-ipcidr, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Private.mrs, path: ./ruleset/PrivateIP.mrs }
  AIIP:           { <<: *rule-set-ipcidr, url: https://github.com/666OS/rules/raw/release/mihomo/ip/AI.mrs, path: ./ruleset/AIIP.mrs }
  EmbyIP:         { <<: *rule-set-ipcidr, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Emby.mrs, path: ./ruleset/EmbyIP.mrs }
  ProxyIP:        { <<: *rule-set-ipcidr, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Proxy.mrs, path: ./ruleset/ProxyIP.mrs }
  ChinaIP:        { <<: *rule-set-ipcidr, url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs, path: ./ruleset/ChinaIP.mrs }
  
  自定义直连:     { type: http, behavior: classical, format: yaml, url: https://github.com/ARIALUX-droid/mih-lux/raw/main/rule/CustomDirect.yaml, interval: 86400, path: ./ruleset/CustomDirect.yaml }
  自定义代理:     { type: http, behavior: domain, format: yaml, url: https://github.com/ARIALUX-droid/mih-lux/raw/main/rule/CustomProxy.yaml, interval: 86400, path: ./ruleset/CustomProxy.yaml }
